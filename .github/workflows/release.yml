name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: gradle build -Pversion="$VERSION" --stacktrace --console=plain
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Throwing Disk ${{ github.ref_name }}
          generate_release_notes: true
          files: build/libs/*.jar
          body: |
            Throwing Disk ${{ github.ref_name }} for Paper 1.21.11 (Java 21).
            Drop the attached JAR into `plugins/`, run `/throwingdisk pack` and host the generated resource pack.
